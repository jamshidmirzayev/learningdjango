
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sahifa topilmadi</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
        }

        h1 {
            font-size: 120px;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background: #0284c7;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            transition: 0.3s;
        }

        a:hover {
            background: #0369a1;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>404</h1>

        <h2>Sahifa topilmadi!</h2>

        <p>
            Kechirasiz, siz qidirayotgan sahifa mavjud emas
            yoki uning manzili o‘zgartirilgan.
        </p>

        <a href="/">Bosh sahifaga qaytish</a>
    </div>

</body>
</html>
